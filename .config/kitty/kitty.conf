# Font settings
font_family GoMono Nerd Font
font_size 14.0
disable_ligatures always
# Thicker text on light backgrounds
text_composition_strategy 1.7 30
# Slightly more line spacing
modify_font cell_height 110%
# Undercurl style for diagnostics in nvim
undercurl_style thick-sparse
# Curly underline when hovering URLs
url_style curly

# Reverse cursor color like in other terminal emulators
cursor none
cursor_shape beam
# Fade the cursor in and out when blinking
cursor_blink_interval 0.5 ease-in-out
# Animate a trail when the cursor jumps far
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollback settings
scrollback_lines 10000
scrollback_pager_history_size 100

# Strip trailing spaces when copying non-rectangle selections
strip_trailing_spaces smart

# Window settings
# background_opacity 0.8
tab_bar_min_tabs 2
# hide_window_decorations yes
confirm_os_window_close 0
window_padding_width 6

# Color scheme
include themes/vimbones.conf

# Key bindings
# Reload the configuration
map ctrl+shift+r load_config_file
# Ctrl + Backspace to delete words
map ctrl+backspace send_text all \x17
# Cmd + Left/Right to jump to the start/end of the line (macOS style)
map cmd+left send_text all \x01
map cmd+right send_text all \x05
# Toggle fullscreen
map alt+shift+f toggle_fullscreen

# Tabs with vim-like keys
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+j move_tab_backward
map ctrl+shift+k move_tab_forward
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
